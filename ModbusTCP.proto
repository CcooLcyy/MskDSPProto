syntax = "proto3";

package ModbusTCPProto;

import "ModbusRTU.proto";

message Empty {}

message TcpConfig {
  string host = 1;
  uint32 port = 2;
  uint32 unit_id = 3;
  uint32 connect_timeout_ms = 4;
  uint32 request_timeout_ms = 5;
}

message LinkConfig {
  string conn_name = 1;
  TcpConfig tcp = 2;
  uint32 poll_interval_ms = 3;
  ModbusRTUProto.AddressBase address_base = 4;
  ModbusRTUProto.ReadPlan read_plan = 5;
}

enum LinkState {
  LINK_STATE_UNSPECIFIED = 0;
  LINK_STATE_STOPPED = 1;
  LINK_STATE_RUNNING = 2;
  LINK_STATE_PENDING_DELETE = 3;
}

message LinkInfo {
  LinkConfig config = 1;
  uint32 conn_id = 2;
  LinkState state = 3;
  string last_error = 4;
}

message PersistedLink {
  LinkConfig config = 1;
  uint32 conn_id = 2;
  bool pending_delete = 3;
}

message LinksConfig { repeated PersistedLink links = 1; }

message UpsertLinkRequest {
  LinkConfig config = 1;
  bool create_only = 2;
  // 可选连接配置 CAS；需与设备当前完整配置相同，不符或目标不存在返回 ABORTED。
  LinkConfig expected_config = 3;
  // 可选点表版本 CAS；用于读取计划更新/回滚，点表已变化或目标不存在返回 ABORTED。
  optional uint64 expected_point_table_revision = 4;
}

message RenameLinkRequest {
  string old_conn_name = 1;
  string new_conn_name = 2;
}

message GetLinkRequest { string conn_name = 1; }
message DeleteLinkRequest { string conn_name = 1; }
message StartLinkRequest { string conn_name = 1; }
message StopLinkRequest { string conn_name = 1; }
message ListLinksResponse { repeated LinkInfo links = 1; }

message UpsertPointTableRequest {
  string conn_name = 1;
  repeated ModbusRTUProto.Point points = 2;
  bool replace = 3;
  // 可选并发保护；与当前版本不符返回 ABORTED，不修改点表或来源。
  optional uint64 expected_revision = 4;
  // 省略则保留来源；提供时必须 replace=true 且预期版本非零，空字符串清空来源。
  optional string template_bindings_json = 5;
  // 可选连接配置快照；点表保存时在同一锁内比较，配置变化返回 ABORTED。
  LinkConfig expected_link_config = 6;
}

message GetPointTableRequest { string conn_name = 1; }
message PointTable {
  string conn_name = 1;
  repeated ModbusRTUProto.Point points = 2;
  // 点表成功保存后递增；支持模板来源的新下位机始终返回正数，旧下位机为零。
  uint64 revision = 3;
  // 有界 UTF-8 JSON，包含平台模板身份、版本、源点映射及应用基线，随点表原子落盘。
  string template_bindings_json = 4;
}
message PointTablesConfig { repeated PointTable point_tables = 1; }

// ModbusTCP 控制面服务：通过一元 RPC 管理 TCP 主站链路、点表和链路内功能启停，不提供流式接口。
service ModbusTCPService {
  // 创建或更新 TCP 链路配置并落盘，同时创建或复用 DataCenter 连接，但不启动链路内 TCP 连接功能。
  // create_only=true 且同名链路存在时返回 ALREADY_EXISTS；链路运行中返回 FAILED_PRECONDITION；配置缺失或字段越界返回 INVALID_ARGUMENT。
  // 提供 expected_config 时进行完整配置 CAS，配置变化或目标不存在返回 ABORTED，不覆盖配置。
  // 提供 expected_point_table_revision 时同时比较点表版本，点表已变化返回 ABORTED，避免读取计划回滚覆盖已提交点表。
  rpc UpsertLink(UpsertLinkRequest) returns (LinkInfo);
  // 重命名停止状态的 TCP 链路并同步 DataCenter 连接名、链路和点表持久化数据，原 conn_id 保持不变。
  // 旧名称不存在时返回 NOT_FOUND，新名称已存在时返回 ALREADY_EXISTS，链路运行中返回 FAILED_PRECONDITION，空名称返回 INVALID_ARGUMENT。
  rpc RenameLink(RenameLinkRequest) returns (LinkInfo);
  // 幂等查询单条 TCP 链路的配置、conn_id、运行状态和最近错误，不修改运行态或持久化数据。
  // 连接名为空时返回 INVALID_ARGUMENT，不存在时返回 NOT_FOUND。
  rpc GetLink(GetLinkRequest) returns (LinkInfo);
  // 幂等列出全部 TCP 链路的当前信息，不修改运行态或持久化数据；空集合返回成功且 links 为空。
  rpc ListLinks(Empty) returns (ListLinksResponse);
  // 删除 TCP 链路；若链路正在运行会先停止链路内功能，再删除 DataCenter 连接并落盘清理链路和点表。
  // 连接不存在时返回 NOT_FOUND；DataCenter 删除失败时保留链路并标记为 PENDING_DELETE，返回对应下游错误。
  rpc DeleteLink(DeleteLinkRequest) returns (Empty);
  // 启动链路内 TCP 连接、轮询和写命令订阅；重复启动已运行链路按幂等成功处理，运行状态不单独落盘。
  // 连接不存在时返回 NOT_FOUND，点表未配置或链路待删除时返回 FAILED_PRECONDITION，建连失败时返回对应通信错误并写入 last_error。
  rpc StartLink(StartLinkRequest) returns (Empty);
  // 停止链路内 TCP 连接、轮询和写命令订阅；重复停止按幂等成功处理，运行状态不单独落盘。
  // 连接不存在时返回 NOT_FOUND；待删除状态保持不变。
  rpc StopLink(StopLinkRequest) returns (Empty);
  // 合并或覆盖停止状态链路的点表，同步覆盖 DataCenter 标签并落盘；保存后保持链路内功能停止状态。
  // 连接不存在返回 NOT_FOUND，运行中或待删除返回 FAILED_PRECONDITION；点表非法或映射冲突返回 INVALID_ARGUMENT 或 ALREADY_EXISTS。
  // 来源最多 32 MiB；提供来源需完整替换及非零预期版本，非法参数返回 INVALID_ARGUMENT，版本冲突返回 ABORTED。
  // 预期连接配置变化返回 ABORTED。先落盘后同步 DataCenter tags，磁盘失败不触碰标签/路由。
  // DataCenter 同步失败则回滚磁盘点表，内存版本及来源不推进；磁盘回滚失败明确报告并记录日志。
  // 不提供来源的旧客户端保存会保留原来源并推进版本。
  rpc UpsertPointTable(UpsertPointTableRequest) returns (Empty);
  // 幂等查询指定链路的当前点表，不修改运行态或持久化数据。
  // 同时返回实际点表、正数 revision 与来源快照，供上位机跨电脑比对更新。
  // 连接名为空时返回 INVALID_ARGUMENT，不存在时返回 NOT_FOUND。
  rpc GetPointTable(GetPointTableRequest) returns (PointTable);
}
