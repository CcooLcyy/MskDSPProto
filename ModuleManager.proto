syntax = "proto3";

package ModuleManagerProto;

// 空参数
message Empty {}

// 模块版本
message ModuleVersion {
  string major   = 1;
  string minor   = 2;
  string patch   = 3;
  string version = 4;
}

// 模块依赖项
message ModuleDependency {
  // 依赖模块名（对应 module_name）。
  string module_name   = 1;
  // 版本约束表达式，例如 "=0.0.1"、">=1.2.0 <2.0.0"。
  string version_range = 2;
}

// 模块清单（由模块导出，用于描述依赖关系）。
message ModuleManifest {
  // 模块名（应与共享库名中的模块名一致）。
  string module_name = 1;
  // 模块版本信息（以 manifest 为准）。
  ModuleVersion version = 2;
  // 模块依赖列表。
  repeated ModuleDependency dependencies = 3;
}

// 模块信息
message ModuleInfo {
  string        module_name = 1;
  ModuleVersion version     = 2;
  string        lib_name    = 3;
  // 模块依赖列表（来自 manifest）。
  repeated ModuleDependency dependencies   = 4;
  // manifest 解析错误（为空表示可用；非空表示不可用）。
  string                   manifest_error  = 5;
}

// 模块信息数组
message ModuleInfos {
  repeated ModuleInfo module_info = 1;
}

// 模块运行时信息
message ModuleRunningInfo {
  string        module_name       = 1;
  ModuleVersion version           = 2;
  string        lib_name          = 3;
  string        inner_grpc_server = 4;
  string        outer_grpc_server = 5;
}

message ModuleRunningInfos {
  repeated ModuleRunningInfo module_running_info = 1;
}

// 设备普通 IPv4 外网出口；与平台接入开关独立，不接管纵密地址及 NAT。
message OrdinaryNetworkConfig {
  // 空字符串表示使用系统现有网络；指定出口时必须是设备上存在的网卡。
  string interface_name = 1;
  // 指定网卡上的同网段 IPv4 网关；不能使用本机地址、广播或多播地址。
  string gateway = 2;
  // 可选的逐接口 IPv4 DNS；不修改其他接口的解析配置。
  repeated string dns_servers = 3;
}

// 设备平台接入的脱敏配置与运行状态；不返回设备令牌明文。
message PlatformAccessStatus {
  bool enabled = 1;
  // 固定为 60.208.15.90:50000，仅供上位机显示，不允许通过配置修改。
  string platform_target = 2;
  string device_id = 3;
  bool token_configured = 4;
  bool ssh_enabled = 5;
  uint32 ssh_port = 6;
  // 配置修订，首次未保存时为 0；运行状态改变不会增加此值。
  uint64 revision = 7;
  bool online = 8;
  // 脱敏的配置或连接错误，不包含令牌、请求正文或原始配置内容。
  string last_error = 9;
  // 新服务端始终回传本消息；旧服务端省略时表示不支持普通外网配置。
  OrdinaryNetworkConfig network_config = 10;
  // 仅表示网络设置已应用，不代表外网或平台业务连通性已经验证。
  bool network_applied = 11;
  // 网络应用错误独立于平台连接错误，不包含身份令牌。
  string network_error = 12;
  // 指定出口网卡上实际选用的本机 IPv4 地址，只读。
  string network_source_address = 13;
}

// 出厂前通过现场管理连接保存平台接入设置，平台地址不可修改。
message SetPlatformAccessConfigRequest {
  // 必须等于读取到的配置修订，防止多个上位机覆盖彼此的修改。
  uint64 expected_revision = 1;
  bool enabled = 2;
  string device_id = 3;
  // 只写字段；为空保留已有令牌，更换已配置令牌的设备 ID 时需提供新令牌或显式清除。
  string device_token = 4;
  bool ssh_enabled = 5;
  // 0 使用默认 22，其余必须为 1～65535 的本机 SSH 端口。
  uint32 ssh_port = 6;
  // 与非空 device_token 互斥；开启平台接入时不能清除令牌。
  bool clear_device_token = 7;
  // 省略保留已有网络设置，兼容旧客户端；消息存在但网卡为空则撤销本功能管理的出口。
  OrdinaryNetworkConfig network_config = 8;
}

// 模块管理服务：用于上位机发现模块、启动/停止模块、查询运行时 gRPC 地址等。
// 说明：当前实现大多返回 OK（失败场景主要通过日志或回读查询验证），后续可扩展为返回明确错误码。
service ModuleManage {
  // 扫描工作目录 `./module` 下的模块共享库并返回模块列表。
  // - 用途：上位机展示“可启动模块”列表；建议将返回结果作为 Start/Stop 的入参，避免 module_name/lib_name 不匹配。
  // - 返回：每个模块包含 module_name、lib_name、version（来自 manifest）、dependencies 与 manifest_error。
  // - 说明：manifest_error 非空时表示模块不可用，StartModule 将返回失败。
  rpc GetModuleInfo(Empty) returns (ModuleInfos) {}
  // 获取已启动模块的运行时信息。
  // - 返回：module_name/lib_name/version，以及 inner_grpc_server（unix socket）与 outer_grpc_server（TCP）。
  // - 说明：模块端口可能随重启变化；上位机应在连接失败时重新调用本 RPC 刷新地址。
  rpc GetRunningModuleInfo(Empty) returns (ModuleRunningInfos) {}
  // 启动指定模块：动态加载共享库，调用 create() 工厂函数创建实例，并在独立线程运行模块 start()。
  // - 入参：建议使用 GetModuleInfo 返回的 ModuleInfo；仅凭 module_name 可能无法定位到正确库文件。
  // - 副作用：模块可能创建/占用对外 gRPC 端口与 `./socket/<模块名>.sock`（模块内部 gRPC）。
  // - 依赖：会自动按依赖拓扑顺序启动依赖模块；依赖缺失/循环/版本不满足将返回失败。
  // - 错误码：FAILED_PRECONDITION（依赖问题/模块不可用）、NOT_FOUND（模块不存在）、INVALID_ARGUMENT（入参不合法）。
  rpc StartModule(ModuleInfo) returns (Empty) {}
  // 停止指定模块：请求模块停止、关闭其 gRPC Server、回收线程并卸载共享库。
  // - 入参：与 StartModule 一致；通常使用 GetRunningModuleInfo 返回的 module_name/lib_name。
  // - 依赖：会级联停止依赖该模块的上游模块（反向依赖）。
  // - 错误码：FAILED_PRECONDITION（级联停止失败）、NOT_FOUND（模块不存在）、INVALID_ARGUMENT（入参不合法）。
  rpc StopModule(ModuleInfo) returns (Empty) {}
  // 上传模块（预留）。
  // - 当前实现：no-op，仅返回 OK。
  rpc UploadModule(Empty) returns (Empty) {}
  // 删除模块（预留）。
  // - 当前实现：no-op，仅返回 OK。
  rpc DeleteModule(ModuleInfo) returns (Empty) {}
  // 保存“启动模块列表”配置到 `./conf/config.db` 的 `ModuleManager/module_start_config`，用于上位机记忆启动集。
  // - 当前实现：仅落盘保存，不会在启动时自动读取并启动（如需自启动请由上位机调用 StartModule）。
  rpc SaveModuleStartConfig(ModuleInfos) returns (Empty) {}
  // 读取脱敏的平台接入及普通外网持久配置和运行状态，一元、幂等，不落盘也不建立连接。
  // 控制器未安装返回 UNAVAILABLE；旧设备未实现该接口时由 gRPC 返回 UNIMPLEMENTED。
  rpc GetPlatformAccessConfig(Empty) returns (PlatformAccessStatus) {}
  // 校验修订后应用普通外网、持久保存并切换平台连接功能，一元；相同的已成功配置保持幂等。
  // 普通外网设置与平台开关独立；首次网络应用或失败恢复可能耗时，调用方应允许至少45秒。
  // 空令牌保留，显式清除与新令牌互斥；响应不包含令牌，也不保证保存时已连接平台。
  // 错误码：INVALID_ARGUMENT（字段/身份不合法）、ABORTED（修订冲突）、
  // FAILED_PRECONDITION（网络应用失败，需回读独立网络状态）、UNAVAILABLE（控制器未安装）、
  // INTERNAL（持久化失败）；网络应用或保存失败时尝试恢复原网络，失败不得启动新的连接任务。
  rpc SetPlatformAccessConfig(SetPlatformAccessConfigRequest) returns (PlatformAccessStatus) {}
}
