syntax = "proto3";

package DataCenterProto;

// 空参数
message Empty {}

// 点值质量
enum Quality {
  QUALITY_UNSPECIFIED = 0;
  QUALITY_GOOD        = 1;
  QUALITY_BAD         = 2;
  QUALITY_UNCERTAIN   = 3;
}

// 同步命令执行结果。
enum CommandStatus {
  COMMAND_STATUS_UNSPECIFIED = 0;
  // 目标模块已接受并执行命令。
  COMMAND_ACCEPTED = 1;
  // 目标模块明确拒绝命令。
  COMMAND_REJECTED = 2;
  // 命令源端点未匹配到路由。
  COMMAND_NO_ROUTE = 3;
  // 命令源端点匹配到多条路由，无法给协议调用方形成单一确认。
  COMMAND_AMBIGUOUS_ROUTE = 4;
  // 目标模块命令执行服务不可达或未实现。
  COMMAND_TARGET_UNAVAILABLE = 5;
  // 目标模块命令执行超时。
  COMMAND_TIMEOUT = 6;
  // 内部错误。
  COMMAND_INTERNAL_ERROR = 7;
}

// 同步命令拒绝原因。
enum CommandRejectCode {
  COMMAND_REJECT_UNSPECIFIED = 0;
  COMMAND_REJECT_OVER_UPPER_LIMIT = 1;
  COMMAND_REJECT_BELOW_LOWER_LIMIT = 2;
  COMMAND_REJECT_GROUP_NOT_RUNNING = 3;
  COMMAND_REJECT_MISSING_MEASUREMENT = 4;
  COMMAND_REJECT_BAD_CONFIG = 5;
  COMMAND_REJECT_UNSUPPORTED_POINT = 6;
}

// 点值（按需扩展）
message PointValue {
  oneof kind {
    bool   bool_value   = 1;
    int64  int_value    = 2;
    double double_value = 3;
    string string_value = 4;
    bytes  bytes_value  = 5;
  }
}

// 端点：一个连接内的一个逻辑点
message Endpoint {
  // 连接 ID（当前运行时展示/过滤/兼容调用使用；0 表示未设置；不作为持久化主键）
  uint32 conn_id = 1;
  // 逻辑点名（UTF-8，可中文）
  string tag = 2;
  // 稳定连接主键：模块名；新路由配置应优先填写，避免 conn_id 重排导致路由错位
  string module_name = 3;
  // 稳定连接主键：模块内连接名；新路由配置应优先填写，避免 conn_id 重排导致路由错位
  string conn_name = 4;
}

// 连接信息（用于展示/校验）
message ConnectionInfo {
  uint32 conn_id     = 1;
  string module_name = 2;
  string conn_name   = 3;
}

// 连接主键（用于分配/查询 conn_id）
message ConnectionKey {
  string module_name = 1;
  string conn_name   = 2;
}

message GetOrCreateConnectionRequest {
  ConnectionKey key = 1;
}

message RenameConnectionRequest {
  ConnectionKey old_key = 1;
  ConnectionKey new_key = 2;
}

message DeleteConnectionRequest {
  ConnectionKey key = 1;
}

// 连接注册表（用于落盘持久化 conn_id 分配与映射）
message ConnectionsConfig {
  // 下一次分配的 conn_id（单调递增；0 表示由 DataCenter 计算）
  uint32 next_conn_id = 1;
  repeated ConnectionInfo conns = 2;
}

message UpsertConnectionRequest {
  ConnectionInfo conn = 1;
}

message ListConnectionsResponse {
  repeated ConnectionInfo conns = 1;
}

// 连接标签注册表（稳定连接主键 -> tags，用于路由校验/展示/自愈；不是协议地址映射点表）
message ConnTags {
  // 运行时连接 ID；仅用于当前会话展示/查询回填，不作为持久化主键
  uint32 conn_id = 1;
  repeated string tags = 2;
  // 稳定连接主键：模块名
  string module_name = 3;
  // 稳定连接主键：模块内连接名
  string conn_name = 4;
}

// 连接标签注册表配置（用于落盘持久化）
message ConnTagsConfig {
  repeated ConnTags conn_tags = 1;
}

message UpsertConnTagsRequest {
  uint32          conn_id = 1;
  repeated string tags    = 2;
  // true: 覆盖更新；false: 增量追加
  bool replace = 3;
}

message GetConnTagsRequest {
  uint32 conn_id = 1;
}

// 有向路由：src -> dst
message Route {
  Endpoint src = 1;
  Endpoint dst = 2;
}

message UpsertRoutesRequest {
  repeated Route routes = 1;
  // true: 覆盖全部路由；false: 增量追加
  bool replace = 2;
}

message DeleteRoutesRequest {
  repeated Route routes = 1;
}

message ListRoutesRequest {
  // 过滤条件（默认 0/空 表示不做过滤）
  uint32 src_conn_id = 1;
  string src_tag     = 2;
  uint32 dst_conn_id = 3;
  string dst_tag     = 4;
}

message ListRoutesResponse {
  repeated Route routes = 1;
}

// 路由配置（用于落盘持久化）
message RoutesConfig {
  repeated Route routes = 1;
}

// DataCenter 完整配置状态（作为 SQLite payload 落盘，避免 connections/conn_tags/routes 代际不一致）
message DataCenterState {
  ConnectionsConfig connections = 1;
  ConnTagsConfig conn_tags = 2;
  RoutesConfig routes = 3;
  // 状态 payload 格式版本；由 DataCenterStateStore 保存时写入。
  uint32 schema_version = 4;
}

// 发布点值（源连接/点）
message PublishRequest {
  uint32     conn_id  = 1;
  string     tag      = 2;
  PointValue value    = 3;
  // 毫秒时间戳；<=0 表示由 DataCenter 填充
  int64   ts_ms   = 4;
  Quality quality = 5;
}

message BatchPublishRequest {
  repeated PublishRequest points = 1;
}

// 同步命令执行请求：由协议模块发起，DataCenter 按路由转交目标模块。
message ExecuteCommandRequest {
  Endpoint src = 1;
  PointValue value = 2;
  // 毫秒时间戳；<=0 表示由接收方填充
  int64 ts_ms = 3;
  Quality quality = 4;
  // 调用方生成的请求 ID，用于日志关联和幂等扩展；可为空。
  string request_id = 5;
  // 调用方期望的超时时间；0 表示使用接收方默认值。
  uint32 timeout_ms = 6;
  // DataCenter 转发给目标模块时填写的目的端点；协议模块发起调用时可不填。
  Endpoint dst = 7;
}

// 同步命令执行响应。
message ExecuteCommandResponse {
  CommandStatus status = 1;
  CommandRejectCode reject_code = 2;
  string reason = 3;
  Endpoint dst = 4;
  double requested_value = 5;
  double accepted_value = 6;
  double lower_limit = 7;
  double upper_limit = 8;
}

// 路由后的点值更新（目的连接/点）
message PointUpdate {
  uint32 src_conn_id = 1;
  string src_tag     = 2;
  uint32 dst_conn_id = 3;
  string dst_tag     = 4;

  PointValue value   = 5;
  int64      ts_ms   = 6;
  Quality    quality = 7;
}

// 源端点最新值更新（用于实时监视，不依赖路由）。
// sequence 在当前 DataCenter 进程内全局单调递增；进程重启后从头计数。
message SourcePointUpdate {
  uint32 conn_id = 1;
  string tag = 2;
  PointValue value = 3;
  int64 ts_ms = 4;
  Quality quality = 5;
  uint64 sequence = 6;
}

message SubscribeRequest {
  // 订阅哪个连接的数据（目的连接）
  uint32 conn_id = 1;
  // 订阅过滤：空表示订阅该连接全部 tag
  repeated string tags = 2;
  // true: 先推送一次最新值快照（best-effort），再推送实时更新
  bool snapshot = 3;
}

message GetLatestRequest {
  uint32          conn_id = 1;
  repeated string tags    = 2;
}

message GetLatestResponse {
  repeated PointUpdate updates = 1;
}

message GetSourceLatestRequest {
  uint32 conn_id = 1;
  repeated string tags = 2;
}

message GetSourceLatestResponse {
  repeated SourcePointUpdate updates = 1;
}

// 通用同步命令执行服务：需要参与协议级命令确认的模块实现该服务。
service CommandExecutor {
  // 同步校验并执行一个命令点。
  // - ACCEPTED：命令已被目标模块接受并执行。
  // - REJECTED：命令被目标模块按业务规则拒绝，reason/reject_code 给出原因。
  // - TARGET_UNAVAILABLE/TIMEOUT/INTERNAL_ERROR：命令未确认执行成功，协议模块应按失败处理。
  rpc ExecuteCommand(ExecuteCommandRequest) returns (ExecuteCommandResponse);
}

// 数据中心服务：进程内“数据总线/转发枢纽”。
// - 上位机负责下发连接/连接标签注册表/路由配置；各协议模块负责 Publish/Subscribe 与协议互操作。
// - 重要语义：Subscribe 与最新值缓存均为 best-effort（可能丢消息）；配置落盘失败会返回 Status，但内存状态不会回滚。
service DataCenterService {
  // 注册/更新已分配 conn_id 的连接信息（展示/校验用）。
  // - 说明：不会分配 conn_id；若 conn_id 未在注册表中存在则返回 NOT_FOUND。
  // - 常见错误：INVALID_ARGUMENT（字段缺失）、NOT_FOUND（conn_id 未分配）、ALREADY_EXISTS（(module_name, conn_name) 冲突）。
  // - 副作用：成功后会触发连接注册表落盘（失败返回 INTERNAL；内存不回滚）。
  rpc UpsertConnection(UpsertConnectionRequest) returns (Empty);

  // 列出连接注册表中的全部连接信息（用于 UI 展示/校验）。
  rpc ListConnections(Empty) returns (ListConnectionsResponse);

  // conn_id 分配器：按 (module_name, conn_name) 查询/创建稳定的 conn_id（全局唯一，可持久化）。
  // - 若 key 已存在：返回既有 ConnectionInfo。
  // - 若 key 不存在：分配新的 conn_id 并写入注册表。
  // - 常见错误：INVALID_ARGUMENT（key 缺失）、RESOURCE_EXHAUSTED（conn_id 耗尽）。
  // - 副作用：成功后会触发连接注册表落盘（失败返回 INTERNAL；内存不回滚）。
  rpc GetOrCreateConnection(GetOrCreateConnectionRequest) returns (ConnectionInfo);

  // 重命名连接主键：将 (module_name, conn_name) 从 old_key 改为 new_key，conn_id 保持不变。
  // - 若 old_key == new_key：幂等返回该连接信息。
  // - 常见错误：INVALID_ARGUMENT（key 缺失）、NOT_FOUND（old_key 不存在）、ALREADY_EXISTS（new_key 已被其他 conn_id 占用）。
  // - 副作用：成功后会触发连接注册表落盘（失败返回 INTERNAL；内存不回滚）。
  rpc RenameConnection(RenameConnectionRequest) returns (ConnectionInfo);

  // 删除连接（按 (module_name, conn_name)）。
  // - 副作用：会删除该 conn_id 关联的连接标签注册表/路由/源端与目的端最新值缓存，并关闭该 conn_id 的所有订阅流（best-effort）。
  // - 常见错误：INVALID_ARGUMENT（key 缺失）、NOT_FOUND（连接不存在）。
  // - 落盘：成功后会触发完整状态单文件落盘（失败返回 INTERNAL；内存不回滚）。
  rpc DeleteConnection(DeleteConnectionRequest) returns (Empty);

  // 注册/更新某连接的连接标签注册表（稳定连接主键 -> tags，仅用于路由配置校验/展示/自愈，不是协议地址映射点表）。
  // - 请求使用当前 conn_id，DataCenter 会先解析为 (module_name, conn_name)，持久化时以稳定连接主键保存。
  // - replace=true：覆盖该稳定连接主键的全部 tags；false：增量追加 tags。
  // - 常见错误：INVALID_ARGUMENT（conn_id=0 或 tags 含空字符串）、NOT_FOUND（conn_id 未注册）。
  // - 副作用：成功后会触发完整状态单文件落盘（失败返回 INTERNAL；内存不回滚）。
  rpc UpsertConnTags(UpsertConnTagsRequest) returns (Empty);

  // 获取某连接的连接标签注册表（tag 列表）。
  // - 响应会回填当前 conn_id 与稳定连接主键。
  // - 常见错误：INVALID_ARGUMENT（conn_id=0）、NOT_FOUND（conn_id 未注册或连接标签注册表不存在）。
  rpc GetConnTags(GetConnTagsRequest) returns (ConnTags);

  // 配置有向路由：src Endpoint -> dst Endpoint。
  // - replace=true：用请求中的路由整体替换全部路由；false：在当前路由基础上增量追加。
  // - 端点身份：应优先填写 module_name/conn_name/tag；仅填写 conn_id/tag 时，DataCenter 会按当前连接注册表转换为稳定连接主键。
  // - 校验：稳定连接主键必须存在；当某连接已存在连接标签注册表时，src/dst 的 tag 必须在该注册表中；否则返回 NOT_FOUND 或 INVALID_ARGUMENT。
  // - 原子性：先构造并校验新路由集合，全部通过后才替换内存状态；校验失败时旧路由保持不变。
  // - 副作用：成功后会触发完整状态单文件落盘（失败返回 INTERNAL；内存不回滚）。
  rpc UpsertRoutes(UpsertRoutesRequest) returns (Empty);

  // 删除指定路由绑定（不存在则忽略）。
  // - 端点身份：支持稳定连接主键或当前 conn_id；conn_id 会按连接注册表转换。
  // - 常见错误：INVALID_ARGUMENT（src/dst 端点缺失）、NOT_FOUND（稳定连接主键或 conn_id 无法解析）。
  // - 副作用：成功后会触发完整状态单文件落盘（失败返回 INTERNAL；内存不回滚）。
  rpc DeleteRoutes(DeleteRoutesRequest) returns (Empty);

  // 查询路由列表；支持按 src/dst 的 conn_id/tag 做可选过滤（0/空表示不滤）；响应会尽量同时返回 conn_id 与稳定连接主键。
  rpc ListRoutes(ListRoutesRequest) returns (ListRoutesResponse);

  // 发布单点数据（源端点）：DataCenter 无条件更新源端“最新值缓存”，再按路由生成 PointUpdate，并写入目的端点“最新值缓存”，同时推送订阅者。
  // - ts_ms<=0：由 DataCenter 填充当前毫秒时间戳。
  // - 若该 src 端点无路由：返回 OK（不产生目的端更新，但仍更新源端最新值缓存）。
  // - 常见错误：INVALID_ARGUMENT（conn_id/tag/value 缺失）、NOT_FOUND（源或目的连接未注册）、RESOURCE_EXHAUSTED（源端 sequence 耗尽）。
  rpc Publish(PublishRequest) returns (Empty);

  // 同步执行命令：DataCenter 按源端点路由找到唯一目的端点，并调用目标模块的 CommandExecutor。
  // - 不替代 Publish/Subscribe；仅用于需要协议级正/负确认的命令。
  // - 若没有路由、多路由、目标不可达或目标拒绝，返回 ExecuteCommandResponse.status 表示失败原因。
  // - ACCEPTED 时会更新目的端点最新值缓存；REJECTED 不更新命令输入缓存。
  rpc ExecuteCommand(ExecuteCommandRequest) returns (ExecuteCommandResponse);

  // 批量发布（减少 RPC 次数）；语义与 Publish 等价。
  // - 原子校验：会先校验所有 points 的 conn_id/tag/value/连接与目的路由；若任一不合法则整批失败（不产生任何源端或目的端更新）。
  // - 常见错误：INVALID_ARGUMENT（point 字段缺失）、NOT_FOUND（源或目的连接未注册）、RESOURCE_EXHAUSTED（源端 sequence 耗尽）。
  // - ts_ms<=0：对每个 point 分别填充当前毫秒时间戳。
  rpc BatchPublish(BatchPublishRequest) returns (Empty);

  // 拉取源连接已发布的最新值快照（best-effort；仅最新值，不含历史，也不依赖业务 Route）。
  // - tags 为空：返回该 conn_id 下全部已缓存源点；否则只返回过滤集合。
  // - 返回值只存在于当前 DataCenter 进程内存，重启或删除该连接后会清空；读取不会落盘或修改配置。
  // - sequence 在当前进程内全局单调递增，消费方可用于拒绝乱序响应。
  // - 常见错误：INVALID_ARGUMENT（conn_id=0 或 tags 含空字符串）、NOT_FOUND（conn_id 未注册）。
  rpc GetSourceLatest(GetSourceLatestRequest) returns (GetSourceLatestResponse);

  // 拉取目的连接内的最新值快照（best-effort；仅最新值，不含历史）。
  // - tags 为空：返回该 conn_id 下全部已缓存点；否则只返回过滤集合。
  // - 常见错误：INVALID_ARGUMENT（conn_id=0 或 tags 含空字符串）。
  rpc GetLatest(GetLatestRequest) returns (GetLatestResponse);

  // 订阅目的连接的数据更新（服务端流，best-effort）。
  // - tags 为空：订阅该 conn_id 下全部点；否则仅订阅过滤集合。
  // - snapshot=true：先 best-effort 推送一次 GetLatest 快照，再推送实时更新。
  // - 背压：客户端消费过慢时服务端会丢弃过旧消息以限制队列增长（不保证每条更新都可达）。
  // - 常见错误：INVALID_ARGUMENT（conn_id=0 或 tags 含空字符串）。
  rpc Subscribe(SubscribeRequest) returns (stream PointUpdate);
}
